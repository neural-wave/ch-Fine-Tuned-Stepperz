[project]
name = "sparql-analyzer"
version = "0.1.0"
description = "Analisi SPARQL e controlli deterministici di compliance"
requires-python = ">=3.12"
dependencies = [
    "rdflib==6.3.2",
    "pyparsing==3.2.1",
    "pyshacl==0.25.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "security_gap: regressione delle lacune storiche, verificata con il profilo hardened",
    "risk_demonstration: test che dimostra un rischio osservato, non una protezione",
]
